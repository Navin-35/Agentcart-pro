services:
  - type: web
    name: agentcart-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: backend:.
      - key: RAZORPAY_KEY_ID
        value: rzp_test_TVQr6C3It4AWiR
      - key: RAZORPAY_MOCK_MODE
        value: "false"
      - key: AP2_MANDATE_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
